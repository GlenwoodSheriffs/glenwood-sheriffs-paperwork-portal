<!doctype html>
<html lang="en"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#070b11">
  <meta name="description" content="Create, save, search, and print Glenwood Sheriffs Department paperwork.">
  <meta property="og:title" content="Glenwood Sheriffs Department | Paperwork Portal"><meta property="og:description" content="A focused workspace for incident reports, arrests, citations, BOLOs, and evidence logs."><meta property="og:image" content="https://shadowrp-cad.github.io/glenwood-sheriffs-paperwork-portal/assets/social-preview.png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://shadowrp-cad.github.io/glenwood-sheriffs-paperwork-portal/assets/social-preview.png"><link rel="icon" href="assets/crest.png">
  <title>Glenwood Sheriffs Department | Paperwork Portal</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="features.css"><link rel="stylesheet" href="github.css"><link rel="stylesheet" href="mobile.css"><script src="app.js" defer></script>
</head><body>
  <main class="app-shell"><div class="animated-backdrop" aria-hidden="true"></div><div class="backdrop-shade" aria-hidden="true"></div>
    <aside class="sidebar" id="sidebar"><div class="brand-block"><img src="assets/crest.png" alt="Glenwood Sheriffs Department badge"><div><p>Glenwood</p><span>Sheriffs Department</span></div></div>
      <nav aria-label="Primary navigation"><p class="nav-heading">Workspace</p><button class="nav-item" data-view="dashboard"><span class="nav-icon">▦</span><span>Dashboard</span></button><p class="nav-heading reports-heading">Reports</p><div id="template-nav"></div></nav>
      <div class="sidebar-status"><b>✓</b><div><strong>Local & private</strong><span>Drafts stay on this device</span></div></div>
    </aside>
    <section class="workspace"><header class="topbar"><button class="menu-button" id="menu-button" aria-label="Toggle menu">☰</button><div><p class="eyebrow" id="breadcrumb">Operations / Paperwork</p><h1 id="page-title">Dashboard</h1></div>
      <div class="topbar-actions"><label class="search-box"><span>⌕</span><input id="search" placeholder="Search saved drafts" aria-label="Search saved drafts"></label><button class="glass-button" id="print-button">⎙ Print</button><button class="gold-button" id="save-button">✓ Save draft</button></div></header>
      <div class="content-wrap" id="content"></div></section>
  </main><div class="mobile-scrim" id="mobile-scrim"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
</body></html>
